<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tickets</title>
</head>
<body>
    <h1>Tickets</h1>

    <h2>Ticket details</h2>

    <div style="display: flex; gap: 30px;">

        <form id="ticket-form">
            <label for="title">Title</label>
            <br>
            <input id="title" name="title" required>
            <br><br>

            <label for="description">Description</label>
            <br>
            <textarea id="description" name="description"></textarea>
            <br><br>

            <label for="status">Status</label>
            <br>
            <select id="status" name="status" required>
                <option value="">-- Select status --</option>
                <option value="new">New</option>
                <option value="in progress">In progress</option>
                <option value="completed">Completed</option>
            </select>
            <br><br>

            <label for="priority">Priority</label>
            <br>
            <select id="priority" name="priority" required>
                <option value="">-- Select priority --</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <br><br>

            <button type="submit">Update ticket</button>
            <br>
            <button type="button" id="delete-button">Delete ticket</button>
        </form>

        <div>
            <label for="ticket-list">Select a ticket</label>
            <div id="ticket-list"></div>
        </div>
    </div>
    <br>
    <a href="/ticket/create">Create a ticket</a>

    <p id="result"></p>

    <script>
        let tickets = [];
        
        const ticketList = document.getElementById("ticket-list");
        const form = document.getElementById("ticket-form");
        const result = document.getElementById("result");

        const titleInput = document.getElementById("title");
        const descriptionInput = document.getElementById("description");
        const statusSelect = document.getElementById("status");
        const prioritySelect = document.getElementById("priority");

        const deleteButton = document.getElementById("delete-button");

        async function loadTickets() {
            const response = await fetch("/api/ticket/list");

            ticketList.innerHTML = "";

            if (!response.ok) {
                throw new Error("Failed to load tickets");
            }

            tickets = await response.json();

            tickets.forEach(ticket => {
                const button = document.createElement("button");
                button.textContent = `#${ticket.id} — ${ticket.title}`;
                button.type = "button";

                button.addEventListener("click", () => {
                    titleInput.value = ticket.title;
                    descriptionInput.value = ticket.description ?? "";
                    statusSelect.value = ticket.status;
                    prioritySelect.value = ticket.priority;

                    ticketList.querySelectorAll("button").forEach(btn => {
                        btn.style.fontWeight = "normal";
                    });

                    button.style.fontWeight = "bold";
                    ticketList.dataset.selectedId = ticket.id;
                });

                ticketList.appendChild(button);
                ticketList.appendChild(document.createElement("br"));
            });

            if (tickets.length > 0) {
                ticketList.querySelector("button").click();
            }
        }

        deleteButton.addEventListener("click", async () => {
            const ticketId = ticketList.dataset.selectedId;

            if (!ticketId) {
                result.textContent = "Please select a ticket";
                return;
            }

            try {
                const response = await fetch(`/ticket/${ticketId}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Failed to delete ticket");
                }

                result.textContent = "Ticket deleted successfully";
                delete ticketList.dataset.selectedId;
                form.reset();
                await loadTickets();
            } catch (error) {
                result.textContent = error.message;
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const ticketId = ticketList.dataset.selectedId;

            if (!ticketId) {
                result.textContent = "Please select a ticket";
                return;
            }

            const ticket = {
                title: titleInput.value,
                description: descriptionInput.value || null,
                status: statusSelect.value,
                priority: prioritySelect.value
            };

            try {
                const response = await fetch(`/ticket/${ticketId}`, {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(ticket)
                });

                if (!response.ok) {
                    throw new Error("Failed to update ticket");
                }

                result.textContent = "Ticket updated successfully";

                await loadTickets();
                ticketList.dataset.selectedId = ticketId;

            } catch (error) {
                result.textContent = error.message;
            }
        });

        loadTickets().catch(error => {
            result.textContent = error.message;
        });
    </script>
</body>
</html>
