<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <title>Create ticket</title>
        <link rel="stylesheet" href="/style.css">
    </head>

    <body>
        <div class="page">

            <div class="header">
                <h1>Tickets</h1>
                <a class="create-link" href="/ticket/list">
                    List tickets
                </a>
            </div>

            <h2>Add a ticket</h2>

            <form id="ticket-form" class="ticket-form">

                <div class="field">
                    <label for="title">Ticket title (required)</label>
                    <input id="title" name="title" required>
                </div>

                <div class="field">
                    <label for="description">Ticket description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <div class="actions">
                    <button type="submit">Create ticket</button>
                </div>

            </form>

            <p id="result"></p>

        </div>

        <script>
            const form = document.getElementById("ticket-form");
            const result = document.getElementById("result");

            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const title = form.elements.title.value;
                const description = form.elements.description.value || null;

                try {
                    // 1. Fixed route to match backend (/ticket/create)
                    const response = await fetch("/ticket/create", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ title, description })
                    });

                    if (!response.ok) {
                        throw new Error("Failed to create ticket");
                    }

                    // 2. The backend returns just the ID number
                    const ticketId = await response.json();

                    // 3. Use local variables for title/description since backend only returns ID
                    result.textContent = 
                        `Created ticket #${ticketId}: ${title}: ${description ?? "No description"}`;

                    form.reset();

                } catch (error) {
                    result.textContent = error.message;
                }
            });
        </script>
    </body>
</html>
