[package]
name = "main"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.9.0", features = [ "postgres", "runtime-tokio", "tls-rustls", "macros" ] }
dotenvy = "0.15.7"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", features = ["json"] }
rand = "0.10.3"

[[bin]]
name = "seed_tickets"
path = "tools/seed_tickets.rs"
